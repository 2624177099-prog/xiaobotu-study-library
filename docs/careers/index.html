const qa4=(a,n)=>Array.isArray(a['q'+n])?a['q'+n]:[];
function options4(a,n){
 const all=q4def[n-1][2].map((_,i)=>i);
 if(n!==2)return all;

 if(!chosen.length)return all;

function toggle4(a,n,v){
 const [_,max,opts,exclusive]=q4def[n-1];const old=qa4(a,n);
 if(!opts[v]||!options4(a,n).includes(v))return false;
 let next;
 if(max===1)next=[v];
 else if(old.includes(v))next=old.filter(x=>x!==v);
 else if(exclusive.includes(v))next=[v];
 else {next=old.filter(x=>!exclusive.includes(x));if(next.length>=max)return false;next=[...next,v].sort((x,y)=>x-y)}

 if(n===1&&qa4(a,2).some(x=>!options4(a,2).includes(x)))delete a.q2;

}

function rank4(a){
 return jobs.map(j=>{
  const f=fields4(j), trace=[],conf=[],notes=[];let total=0,den=0;

   const sels=qa4(a,n).filter(v=>rules[v]&&!rules[v].includes('mentor')&&!rules[v].includes('cash'));
   if(!sels.length)continue;
   const w=primary4[n-1];den+=w;
   for(const v of sels){
    const r=rules[v], m=r.filter(t=>f.has(t)).length/r.length;
    total+=m*w/sels.length;
    if(m>0)trace.push({w:m*w/sels.length,text:'第 '+n+' 题「'+q4def[n-1][2][v]+'」对应这项工作的'+(n===7?'已有经验线索':'日常任务')+'：'+j.duties[0]+'。'});
   }
  }
  for(const k of qa4(a,4).filter(v=>v<5)){
   const level=exposure4(j,k),relaxed=Array.isArray(a.flex)&&a.flex.includes(k);
   if(level===3&&!relaxed)conf.push(conditionNames4[k]);
   else if(level>=2||level===null)notes.push(conditionNames4[k]+(level===null?'：收入结构资料不足，投递前核对底薪、绩效及浮动部分。':relaxed?'：你可有限度接受，先核对实际频率与责任范围。':'：可能涉及，需向具体单位核对。'));
  }
  if(qa4(a,5).includes(6))notes.push('你看重带教；向单位询问带教安排和第一个月的实际任务。');
  if(qa4(a,5).includes(1))notes.push('你看重尽早稳定收入；核对固定收入、试用期和首次发薪安排。');
  const later=qa4(a,6).some(v=>v===2||v===3)&&j.training===3;
  if(later)notes.push('这条方向通常需要长期培养，与当前先就业或短期训练目标有距离。');

  return {j,score,tier:conf.length?2:later||score<.35?1:0,reasons:trace.sort((x,y)=>y.w-x.w).map(x=>x.text),notes,conf};
 }).sort((x,y)=>x.tier-y.tier||y.score-x.score||x.j.id.localeCompare(y.j.id));
}

function buildPairQuestions(left,right){
  const resolve = j=>pairSamples[j.n] || [j.duties[0],j.minus[0],j.output];
  const a=resolve(left),b=resolve(right);
  const candidates=[
    {title:'如果跟岗半天，你想先接手哪项工作？',left:a[0],right:b[0],label:'工作样例'},
    {title:'哪一种反复出现的麻烦，你更能忍受？',left:a[1],right:b[1],label:'日常代价'},
    {title:'给你一个下午，你更希望带走哪份成品？',left:a[2],right:b[2],label:'实际产出'}
  ];
  if(left.g!==right.g && (left.g==='A'||right.g==='A')){
    candidates.push({title:'想用一周辨别自己的兴趣，你更想亲手试哪一件？',left:left.task,right:right.task,label:'体验验证'});
  }
  const seen=new Set();
  return candidates.filter(q=>{
    if(!q.left || !q.right || q.left===q.right)return false;
    const key=q.left+'|'+q.right;
    if(seen.has(key))return false;
    seen.add(key);return true;
  }).slice(0,5);
}
function pairOutcome(answers){
  const count=v=>answers.filter(a=>a===v).length;
  const directional=count(0)+count(1);
  if(!answers.length || (!directional && count(3)>count(2)))return {winner:null,label:'还缺一次体验'};
  if(count(0)===count(1))return {winner:null,label:'两者接近'};
  const winner=count(0)>count(1)?0:1;
  return {winner,label:'目前更偏 '+(winner===0?'A':'B')};
}

function wallSave(k){
 const draft=wallDraft(k);wallSetNote(k,draft);
 wallStatus(k,canStore?'已保存到本机。':'仅保留在本次会话，请及时复制或下载。')
}
function wallErase(k){if(!confirm('删除这条本机文字？已发布的副本可单独撤下。'))return;
 wallSetNote(k,null);wallTxt(k).value='';if(k==='feedback')document.getElementById('wall-tag').value='';
 wallStatus(k,'本机文字已删除。')
}
function wallFormat(k,d){return wallKinds[k].title+' · '+d.date+'\n'+(d.tag?'['+d.tag+'] ':'')+d.text}
function wallDownload(k){const d=wallDraft(k);if(!d.text.trim())return wallStatus(k,'请先写下你想保存的文字。');
 const href=URL.createObjectURL(new Blob([wallFormat(k,d)],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=href;link.download=wallKinds[k].title+'_'+d.date+'.txt';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(href),1000)}
function wallCopy(k,b){const d=wallDraft(k);if(!d.text.trim())return wallStatus(k,'请先写下几句话。');return copyText(wallFormat(k,d),b)}
function wallPanel(k){
 const info=wallKinds[k],d=wallGetNote(k),pub=wallPub(k),online=wallOnline();
 return '<details class="wall-sheet"><summary><b>'+info.title+'</b>　<small>选答</small></summary><div class="details"><p>'+info.question+'</p>'+
 (k==='feedback'?'<label>建议类型 <select id="wall-tag"><option value="">不选标签</option>'+wallTags.map(t=>'<option '+(d.tag===t?'selected':'')+'>'+t+'</option>').join('')+'</select></label>':'')+
 '<label for="wall-text-'+k+'">你的文字 · 最多 '+info.limit+' 字</label><textarea style="display:block;box-sizing:border-box;max-width:100%;min-height:9em" id="wall-text-'+k+'" maxlength="'+info.limit+'" placeholder="'+esc(info.placeholder)+'">'+esc(d.text)+'</textarea>'+
 (d.date?'<small>写下于 '+esc(d.date)+'</small>':'')+'<div class="tools"><button class="ghost" onclick="wallSave(\''+k+'\')">保存到本机</button><button class="ghost" onclick="wallCopy(\''+k+'\',this)">'+(k==='feedback'?'复制建议，发给小博土':'复制')+'</button><button class="link" onclick="wallDownload(\''+k+'\')">'+(k==='future'?'下载这封信':'下载文字')+'</button><button class="link" onclick="wallErase(\''+k+'\')">删除本机文字</button></div>'+
 '<p class="muted">'+(k==='feedback'?'复制后可自行发给小博土。公开建议会显示在留言墙，未设置私信收件入口。':k==='future'?'这封信默认只存在本机。想长久保留，可以下载一份。':'这段话默认只存在本机。')+'</p>'+
 (online?'<label><input type="checkbox" id="wall-ok-'+k+'"> 我选择匿名公开这条文字，其他访客可阅读和点赞。</label><div class="tools"><button class="ghost" id="wall-send-'+k+'" onclick="wallPublish(\''+k+'\',this)">'+(pub.live?'更新公开副本':'发布到留言墙')+'</button><button class="link" id="wall-remove-'+k+'" '+(!pub.id?'hidden':'')+' onclick="wallRemoveDraft(\''+k+'\',this)">撤下公开副本</button></div>':'<p class="muted">备用站支持在本机保存或下载；公开留言由完整版提供。</p>')+
 '<p role="status" id="wall-status-'+k+'"></p></div></details>'
}
function notes(){
 view('<section class="catalog"><h1>离开前，想留几句话吗？</h1><p>三道题都可跳过。每条文字单独保存，只有你主动发布的内容才会出现在留言墙。</p>'+
 (!canStore?'<p class="note">浏览器暂时无法保存本机记录，请及时复制或下载。关闭后可能失去已公开留言的管理权。</p>':'')+
 Object.keys(wallKinds).map(wallPanel).join('')+
 '<div class="tools"><a class="ghost" href="https://beyond-clinical-pathfinder.gx2jwkwhpv.chatgpt.site/">完整版公开留言墙</a><button class="link" onclick="'+(s.done?'results()':'home()')+'">'+(s.done?'返回初步结果':'返回首页')+'</button></div></section>')
}
async function wallPublish(k,btn){
 const d=wallDraft(k),agree=document.getElementById('wall-ok-'+k);
 if(!d.text.trim())return wallStatus(k,'先写下要公开的文字。');
 if(!agree.checked)return wallStatus(k,'请先勾选匿名公开，再发布这条文字。');
 const record=wallPub(k),id=record.id||crypto.randomUUID();set('wall-pub-v4-'+k,{...record,id});
 wallSetNote(k,d);btn.disabled=true;
 try{await wallRequest('/'+id,'PUT',{kind:k,body:d.text,tag:d.tag});set('wall-pub-v4-'+k,{id,live:true});agree.checked=false;btn.textContent='更新公开副本';document.getElementById('wall-remove-'+k)?.removeAttribute('hidden');wallStatus(k,'已公开。其他访客现在可以查看和点赞。')}
 catch(e){wallStatus(k,e.message)}finally{btn.disabled=false}
}
async function wallRetract(id){
 await wallRequest('/'+id,'DELETE');
 for(const k of Object.keys(wallKinds))if(wallPub(k).id===id)set('wall-pub-v4-'+k,null)
}
async function wallRemoveDraft(k,b){const id=wallPub(k).id;if(!id||!confirm('从所有访客的留言墙撤下这条文字和点赞？本机草稿保留。'))return;
 b.disabled=true;try{await wallRetract(id);b.hidden=true;document.getElementById('wall-send-'+k).textContent='发布到留言墙';wallStatus(k,'公开副本已撤下。')}catch(e){wallStatus(k,e.message)}finally{b.disabled=false}}
function wall(){
 wallItems=[];wallCursor=null;wallLoad++;
 view('<section class="catalog"><h1>医学生留言墙</h1><p class="muted">这里展示访客主动公开的文字。点一颗心，回应一句有共鸣的话。</p><div id="wall-list"></div><p role="status" id="wall-msg"></p><div class="tools"><button class="ghost" id="wall-more" hidden>查看更多</button><button class="btn" onclick="notes()">写几句话</button><button class="link" onclick="'+(s.done?'results()':'home()')+'">'+(s.done?'返回初步结果':'返回首页')+'</button></div></section>');
 wallFetchPage()
}
async function wallFetchPage(){
 const load=wallLoad,status=document.getElementById('wall-msg'),more=document.getElementById('wall-more');more.disabled=true;status.textContent='正在读取公开留言…';
 try{const res=await wallRequest(wallCursor?'?before='+wallCursor:'');if(load!==wallLoad||!status.isConnected)return;
 wallItems.push(...res.items);wallCursor=res.next;wallDraw();status.textContent=wallItems.length?'':'还没有公开留言。';more.hidden=wallCursor===null;more.onclick=wallFetchPage}
 catch(e){if(status.isConnected){status.textContent=e.message;more.hidden=!wallOnline();more.textContent='再试一次';more.onclick=wallFetchPage}}finally{more.disabled=false}
}
function wallDraw(){const target=document.getElementById('wall-list');if(!target)return;target.replaceChildren();
 for(const item of wallItems){
  const article=document.createElement('article');article.className='panel';article.style.cssText='padding:18px;margin:12px 0;max-width:100%';
  const h=document.createElement('strong');h.textContent=wallKinds[item.kind]?.title||'留言';
  const meta=document.createElement('small');meta.style.display='block';meta.textContent='匿名 · '+(item.tag?item.tag+' · ':'')+(item.created_at||'').slice(0,10)+(item.mine?' · 你发布的':'');
  const p=document.createElement('p');p.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';p.textContent=item.body;
  const tools=document.createElement('div');tools.className='tools';
  const like=document.createElement('button');like.className='ghost';const label=()=>{like.textContent=(item.liked?'♥ 已点赞':'♡ 点赞')+' · '+item.likes;like.setAttribute('aria-pressed',item.liked?'true':'false')};label();
  like.onclick=async()=>{like.disabled=true;try{Object.assign(item,await wallRequest('/'+item.id+'/like',item.liked?'DELETE':'PUT'));label()}catch(e){const status=document.getElementById('wall-msg');if(status)status.textContent=e.message}finally{like.disabled=false}};
  tools.append(like);
  if(item.mine){const del=document.createElement('button');del.className='link';del.textContent='撤下';del.onclick=async()=>{if(!confirm('撤下这条公开留言及点赞？'))return;del.disabled=true;try{await wallRetract(item.id);wallItems=wallItems.filter(x=>x.id!==item.id);wallDraw();const m=document.getElementById('wall-msg');if(m)m.textContent='公开留言已撤下。'}catch(e){const m=document.getElementById('wall-msg');if(m)m.textContent=e.message}finally{del.disabled=false}};tools.append(del)}
  article.append(h,meta,p,tools);target.append(article)
 }}

home();
</script></body></html>
